name: Bazarr+
slug: bazarr_plus
version: "1.0.1"
description: Standalone and automated subtitle manager for movies, TV, and sports
url: https://github.com/tomjansen/hassio-addons/tree/master/bazarr_plus
arch:
  - amd64
  - aarch64
image: ghcr.io/tomjansen/bazarr_plus-{arch}
init: false
startup: services
ports:
  6767/tcp: 6767
ports_description:
  6767/tcp: Web interface
map:
  - addon_config:rw
  - share:rw
  - media:rw
webui: "http://[HOST]:[PORT:6767]"
watchdog: "http://[HOST]:[PORT:6767]/_supervisor/status"
options:
  PUID: 0
  PGID: 0
  TZ: UTC
  UMASK: "002"
schema:
  PUID: int
  PGID: int
  TZ: str
  UMASK: str
