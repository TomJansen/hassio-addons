---
name: Build add-on images

on:
  push:
    branches: [master]
    paths:
      - "**/config.json"
      - "**/config.yaml"
      - "**/config.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The build selection compares github.event.before with the pushed SHA.
      # The default shallow checkout contains only the latter, causing
      # "fatal: bad object" whenever the previous commit is not present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve comparison base
        id: compare
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify "${AFTER}^" >/dev/null 2>&1; then
            base="$(git rev-parse "${AFTER}^")"
            echo "::warning::Previous push SHA is unavailable; comparing with the pushed commit's parent."
          else
            base="$(git hash-object -t tree -w /dev/null)"
            echo "::warning::No parent commit is available; comparing with an empty tree."
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # The aarch64 image is built on this x86 runner, so BuildKit needs
      # binfmt/QEMU in order to execute RUN instructions from the ARM base.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Find version changes and build images
        env:
          BEFORE: ${{ steps.compare.outputs.base }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          files = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BEFORE'], os.environ['AFTER'], '--', '*config.json', '*config.yaml', '*config.yml'], text=True)
          changed = []
          for name in files.splitlines():
              diff = subprocess.check_output(['git', 'diff', os.environ['BEFORE'], os.environ['AFTER'], '--', name], text=True)
              if any(line.startswith('+') and not line.startswith('+++') and ('version:' in line or '"version"' in line) for line in diff.splitlines()):
                  changed.append(name.split('/')[0])
          print('\n'.join(sorted(set(changed))))
          PY
        id: changed
      - name: Build changed images
        env:
          BEFORE: ${{ steps.compare.outputs.base }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for addon in */; do
            [ -d "$addon" ] || continue
            for script in ha_automodules.sh ha_autoapps.sh ha_entrypoint.sh ha_lsio.sh; do
              [ -f ".templates/$script" ] && cp ".templates/$script" "$addon/$script"
            done
          done
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import yaml
          files = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BEFORE'], os.environ['AFTER'], '--', '*config.json', '*config.yaml', '*config.yml'], text=True)
          addons = set()
          for name in files.splitlines():
              diff = subprocess.check_output(['git', 'diff', os.environ['BEFORE'], os.environ['AFTER'], '--', name], text=True)
              if any(line.startswith('+') and not line.startswith('+++') and ('version:' in line or '"version"' in line) for line in diff.splitlines()): addons.add(name.split('/')[0])
          for addon_name in sorted(addons):
              addon = Path(addon_name)
              config_path = next(addon / n for n in ('config.json', 'config.yaml', 'config.yml') if (addon / n).exists())
              config = json.loads(config_path.read_text()) if config_path.suffix == '.json' else yaml.safe_load(config_path.read_text())
              build_path = next((addon / n for n in ('build.json', 'build.yaml', 'build.yml') if (addon / n).exists()), None)
              build = (json.loads(build_path.read_text()) if build_path and build_path.suffix == '.json' else yaml.safe_load(build_path.read_text())) if build_path else {}
              for arch in (build or {}).get('build_from', {}).keys() or config.get('arch', []):
                  dockerfile = addon / (f'Dockerfile.{arch}' if (addon / f'Dockerfile.{arch}').exists() else 'Dockerfile')
                  image = config['image'].replace('{arch}', arch)
                  platform = 'linux/arm64' if arch == 'aarch64' else f'linux/{arch}'
                  subprocess.run(['docker', 'buildx', 'build', '--platform', platform, '--file', str(dockerfile), '--build-arg', f"BUILD_FROM={(build or {}).get('build_from', {}).get(arch, '')}", '--tag', f'{image}:{config["version"]}', '--tag', f'{image}:latest', '--push', str(addon)], check=True)
          PY
