name: Shelfmark
slug: shelfmark
version: "1.0.1"
description: Search for and request books and audiobooks from multiple sources
url: https://github.com/tomjansen/hassio-addons/tree/master/shelfmark
arch:
  - amd64
  - aarch64
image: ghcr.io/tomjansen/shelfmark-{arch}
init: false
startup: services
ports:
  8084/tcp: 8084
ports_description:
  8084/tcp: Web interface
map:
  - addon_config:rw
  - share:rw
  - media:rw
webui: "http://[HOST]:[PORT:8084]"
watchdog: "http://[HOST]:[PORT:8084]/api/health"
options:
  PUID: 1000
  PGID: 1000
  TZ: UTC
  INGEST_DIR: /share/cwa-book-ingest
  SEARCH_MODE: universal
schema:
  PUID: int
  PGID: int
  TZ: str
  INGEST_DIR: str
  SEARCH_MODE: list(direct|universal)
